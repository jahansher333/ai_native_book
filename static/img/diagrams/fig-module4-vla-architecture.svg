<svg width="800" height="550" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="550" fill="#f9f9f9"/>
  <text x="400" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Vision-Language-Action (VLA) Model Architecture</text>

  <!-- Vision Module -->
  <rect x="50" y="80" width="200" height="100" fill="#FF6B9D" stroke="#333" stroke-width="2" rx="5"/>
  <text x="150" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">Vision Module</text>
  <text x="150" y="135" font-size="12" text-anchor="middle" fill="#fff">• Camera Input</text>
  <text x="150" y="155" font-size="12" text-anchor="middle" fill="#fff">• Object Detection</text>
  <text x="150" y="170" font-size="12" text-anchor="middle" fill="#fff">• Scene Understanding</text>

  <!-- Language Module -->
  <rect x="300" y="80" width="200" height="100" fill="#4ECDC4" stroke="#333" stroke-width="2" rx="5"/>
  <text x="400" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">Language Module</text>
  <text x="400" y="135" font-size="12" text-anchor="middle" fill="#fff">• LLM (GPT-4/Claude)</text>
  <text x="400" y="155" font-size="12" text-anchor="middle" fill="#fff">• Task Parsing</text>
  <text x="400" y="170" font-size="12" text-anchor="middle" fill="#fff">• Voice Commands</text>

  <!-- Action Module -->
  <rect x="550" y="80" width="200" height="100" fill="#95E1D3" stroke="#333" stroke-width="2" rx="5"/>
  <text x="650" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Action Module</text>
  <text x="650" y="135" font-size="12" text-anchor="middle" fill="#333">• Motion Planning</text>
  <text x="650" y="155" font-size="12" text-anchor="middle" fill="#333">• Manipulation</text>
  <text x="650" y="170" font-size="12" text-anchor="middle" fill="#333">• Navigation</text>

  <!-- Arrows between modules -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>

  <line x1="250" y1="130" x2="300" y2="130" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="275" y="120" font-size="10" text-anchor="middle" fill="#555">Scene</text>
  <text x="275" y="145" font-size="10" text-anchor="middle" fill="#555">Context</text>

  <line x1="500" y1="130" x2="550" y2="130" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="525" y="120" font-size="10" text-anchor="middle" fill="#555">Robot</text>
  <text x="525" y="145" font-size="10" text-anchor="middle" fill="#555">Commands</text>

  <!-- Multimodal Fusion Layer -->
  <rect x="150" y="220" width="500" height="60" fill="#FFE66D" stroke="#333" stroke-width="2" rx="5"/>
  <text x="400" y="245" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Multimodal Fusion Layer</text>
  <text x="400" y="265" font-size="12" text-anchor="middle" fill="#555">Combines visual, linguistic, and proprioceptive inputs</text>

  <!-- Connections to fusion layer -->
  <line x1="150" y1="180" x2="200" y2="220" stroke="#999" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="400" y1="180" x2="400" y2="220" stroke="#999" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="650" y1="180" x2="600" y2="220" stroke="#999" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Policy Network -->
  <rect x="250" y="310" width="300" height="70" fill="#A8E6CF" stroke="#333" stroke-width="2" rx="5"/>
  <text x="400" y="335" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Policy Network</text>
  <text x="400" y="355" font-size="12" text-anchor="middle" fill="#555">(Transformer-based Decision Making)</text>
  <text x="400" y="370" font-size="11" text-anchor="middle" fill="#555">State → Action Mapping</text>

  <!-- Arrow from fusion to policy -->
  <line x1="400" y1="280" x2="400" y2="310" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Robot Execution -->
  <rect x="250" y="410" width="300" height="70" fill="#FF9F1C" stroke="#333" stroke-width="2" rx="5"/>
  <text x="400" y="435" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">Robot Execution Layer</text>
  <text x="400" y="455" font-size="12" text-anchor="middle" fill="#fff">Low-level motor control via ROS 2</text>
  <text x="400" y="470" font-size="11" text-anchor="middle" fill="#fff">Joint velocities, gripper commands</text>

  <!-- Arrow from policy to execution -->
  <line x1="400" y1="380" x2="400" y2="410" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Example Task -->
  <g>
    <rect x="50" y="500" width="700" height="40" fill="#D1E7DD" stroke="#0F5132" stroke-width="2" rx="5"/>
    <text x="400" y="520" font-size="13" font-weight="bold" text-anchor="middle" fill="#0F5132">Example: "Pick up the red mug and place it on the table"</text>
    <text x="400" y="535" font-size="11" text-anchor="middle" fill="#0F5132">Vision detects mug → Language parses task → Action executes grasp + placement</text>
  </g>
</svg>
