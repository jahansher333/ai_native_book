<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#f9f9f9"/>
  <text x="400" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Isaac AI Perception Pipeline</text>

  <!-- Input Stage -->
  <rect x="50" y="80" width="140" height="80" fill="#76C7C0" stroke="#333" stroke-width="2" rx="5"/>
  <text x="120" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">Isaac Sim</text>
  <text x="120" y="130" font-size="11" text-anchor="middle" fill="#fff">Synthetic Data</text>
  <text x="120" y="145" font-size="11" text-anchor="middle" fill="#fff">Generation</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>

  <!-- Arrow to Isaac ROS -->
  <line x1="190" y1="120" x2="250" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="220" y="110" font-size="10" text-anchor="middle" fill="#555">RGB-D</text>
  <text x="220" y="140" font-size="10" text-anchor="middle" fill="#555">Point Cloud</text>

  <!-- Isaac ROS -->
  <rect x="250" y="80" width="140" height="80" fill="#4A90E2" stroke="#333" stroke-width="2" rx="5"/>
  <text x="320" y="105" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">Isaac ROS</text>
  <text x="320" y="125" font-size="11" text-anchor="middle" fill="#fff">GPU-Accelerated</text>
  <text x="320" y="140" font-size="11" text-anchor="middle" fill="#fff">Perception</text>
  <text x="320" y="155" font-size="9" text-anchor="middle" fill="#fff">(TensorRT)</text>

  <!-- Arrow to DNN Models -->
  <line x1="390" y1="120" x2="450" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- DNN Models -->
  <rect x="450" y="80" width="140" height="80" fill="#7ED321" stroke="#333" stroke-width="2" rx="5"/>
  <text x="520" y="105" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">DNN Models</text>
  <text x="520" y="125" font-size="11" text-anchor="middle" fill="#fff">• Object Detection</text>
  <text x="520" y="140" font-size="11" text-anchor="middle" fill="#fff">• Segmentation</text>
  <text x="520" y="155" font-size="11" text-anchor="middle" fill="#fff">• Pose Estimation</text>

  <!-- Arrow to Output -->
  <line x1="590" y1="120" x2="650" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Output Stage -->
  <rect x="650" y="80" width="140" height="80" fill="#F5A623" stroke="#333" stroke-width="2" rx="5"/>
  <text x="720" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">Navigation</text>
  <text x="720" y="130" font-size="11" text-anchor="middle" fill="#fff">Path Planning</text>
  <text x="720" y="145" font-size="11" text-anchor="middle" fill="#fff">Obstacle Avoidance</text>

  <!-- Module Components -->
  <g>
    <!-- Perception Modules -->
    <text x="50" y="210" font-size="14" font-weight="bold" fill="#333">Perception Modules:</text>

    <rect x="50" y="220" width="180" height="50" fill="#E0F7FA" stroke="#333" stroke-width="1" rx="3"/>
    <text x="140" y="240" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Isaac ROS Visual SLAM</text>
    <text x="140" y="255" font-size="10" text-anchor="middle" fill="#555">Real-time Localization</text>

    <rect x="250" y="220" width="180" height="50" fill="#E0F7FA" stroke="#333" stroke-width="1" rx="3"/>
    <text x="340" y="240" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Isaac ROS DNN Inference</text>
    <text x="340" y="255" font-size="10" text-anchor="middle" fill="#555">YOLO / SegFormer</text>

    <rect x="450" y="220" width="180" height="50" fill="#E0F7FA" stroke="#333" stroke-width="1" rx="3"/>
    <text x="540" y="240" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Isaac ROS Apriltag</text>
    <text x="540" y="255" font-size="10" text-anchor="middle" fill="#555">Fiducial Detection</text>
  </g>

  <!-- Performance Metrics -->
  <rect x="50" y="300" width="740" height="120" fill="#FFF9C4" stroke="#FF9800" stroke-width="2" rx="5"/>
  <text x="420" y="325" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Performance Benefits</text>

  <g>
    <rect x="80" y="340" width="160" height="60" fill="#C8E6C9" stroke="#333" stroke-width="1" rx="3"/>
    <text x="160" y="360" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">GPU Acceleration</text>
    <text x="160" y="380" font-size="11" text-anchor="middle" fill="#555">10-100x faster</text>

    <rect x="270" y="340" width="160" height="60" fill="#C8E6C9" stroke="#333" stroke-width="1" rx="3"/>
    <text x="350" y="360" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">TensorRT Optimization</text>
    <text x="350" y="380" font-size="11" text-anchor="middle" fill="#555">Real-time inference</text>

    <rect x="460" y="340" width="160" height="60" fill="#C8E6C9" stroke="#333" stroke-width="1" rx="3"/>
    <text x="540" y="360" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Zero-Copy Buffers</text>
    <text x="540" y="380" font-size="11" text-anchor="middle" fill="#555">Reduced latency</text>
  </g>
</svg>
